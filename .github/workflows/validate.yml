name: Validate
on:
  push:
  pull_request:
  # The release workflow starts the checks for the pull request that updates
  # the manifest version, because pushes and pull requests made with the
  # workflow token do not trigger workflows.
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check custom_components tests dev
      - run: python -m pytest -q --cov=custom_components.weider --cov-report=term-missing --cov-fail-under=95
      - run: docker compose --profile simulator config --quiet
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

